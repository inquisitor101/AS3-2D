% % % %
% Zone Information.       %
% % % % % % % % % % % % % %

% Total number of zones in grid files.
NUMBER_ZONE = 24

% Type of governing equations solved per zone. Required. Available: EE.
TYPE_SOLVER = ( EE )

% Type of buffer layer per zone. Available and default: NONE.
TYPE_BUFFER_LAYER = ( NONE )

% Grid polynomial degree: 5. The solver reads the order and solution nodes from mesh metadata.

% Riemann solver per zone. Required. Available: ROE.
RIEMANN_SOLVER = ( ROE )



% % % %
% DG Specification.     %
% % % % % % % % % % % % %

% Quadrature options: GAUSS_LEGENDRE, LEGENDRE_GAUSS_LOBATTO, NEWTON_COTES.
% Default: GAUSS_LEGENDRE. NEWTON_COTES supports exactness through degree 7,
% so it cannot meet the requested degree for these degree-5 examples.
TYPE_QUADRATURE = LEGENDRE_GAUSS_LOBATTO

% Non-negative integer bonus factor, nb. NODAL_DG requests degree (2 + nb)*p.
% Default: 0. DG_SEM requires 0 and uses LGL exactness through degree 2*p - 1.
BONUS_QUADRATURE_FACTOR = 0

% DG method options: NODAL_DG, DG_SEM. Default: NODAL_DG.
% DG_SEM requires LGL solution nodes, LGL quadrature, and zero bonus.
TYPE_DG_METHOD = DG_SEM

% DG formulation options: WEAK_FORM, STRONG_FORM. Default: WEAK_FORM.
% STRONG_FORM supports collocated and non-collocated solution/integration nodes.
TYPE_DG_FORMULATION = WEAK_FORM




% % % %
% Temporal Information. %
% % % % % % % % % % % % %

% Temporal integration scheme. Required. Available: SSPRK3.
TEMPORAL_SCHEME = SSPRK3

% Simulation start time [sec].
START_TIME = 0.0

% Synchronization time step [sec].
TIME_STEP  = 2.0e-6

% Maximum (synchronization) time steps.
MAX_ITER_TIME  = 20

% CFL stability number.
CFL_NUMBER = 1.0



% % % %
% Initial Condition Specification.  %
% % % % % % % % % % % % % % % % % % %

% Initial condition for the solution. Required. Available: GAUSSIAN_PRESSURE, ISENTROPIC_VORTEX.
TYPE_IC = GAUSSIAN_PRESSURE

% Disturbance ratio w.r.t. background flow, if needed.
DISTURBANCE_RATIO = 0.0

% Disturbance width, if needed.
DISTURBANCE_WIDTH = 0.01

% Disturbance center, if needed.
DISTURBANCE_CENTER = ( -0.05, 0.025 )

% Freestream Mach number.
FREESTREAM_MACH = 0.1

% Freestream flow angle [deg].
FREESTREAM_FLOW_ANGLE = 0.0



% % % %
% Boundary Condition Specifications.  %
% % % % % % % % % % % % % % % % % % % %

% Available marker conditions: PERIODIC, SYMMETRY, FARFIELD,
% STATIC_MASS_FLOW_INLET_RIEMANN, PRESSURE_OUTLET_RIEMANN.

% Periodic boundary conditions.
MARKER_BC_PERIODIC = ( bottom, top, 0.0, 0.08836 )
MARKER_BC_SYMMETRY = ( blade )
MARKER_BC_STATIC_MASS_FLOW_INLET_RIEMANN = ( left, 1.17659, 34.7224, 0.0 )
MARKER_BC_PRESSURE_OUTLET_RIEMANN = ( right, 101325.0 )




% % % %
% Input Information.  %
% % % % % % % % % % % %

% Input mesh format. Required. Available: AS3.
MESH_FORMAT = AS3

% Input grid file format. Required. Available: BINARY.
INPUT_GRID_FORMAT = BINARY

% Input grid directory. 
GRID_DIRECTORY = grid_lgl_p5/





% % % %
% Output Information. %
% % % % % % % % % % % %

% Output writing frequency for visualization files.
WRITE_VIS_FREQ = 1

% Output visualization format. Required.
% Available: VTK_LEGACY_BINARY (.vtk), VTK_XML_BINARY (.vtu).
OUTPUT_VIS_FORMAT = VTK_LEGACY_BINARY

% Precision of coordinates and point fields in either VTK format.
% Available: SINGLE (32-bit), DOUBLE (64-bit). Default: SINGLE.
OUTPUT_VIS_PRECISION = SINGLE

% Output visualization filename.
OUTPUT_VIS_FILENAME = vis/flow

% Output solution filename.
OUTPUT_SOL_FILENAME = sol/flow

% Variables written for visualization. Required. Choose from:
% DENSITY, MOMENTUM, TOTAL_ENERGY, PRESSURE, VELOCITY, VORTICITY, MACH, TEMPERATURE, ENTROPY.
WRITE_VIS_VARIABLE = ( DENSITY, MOMENTUM, TOTAL_ENERGY, PRESSURE, VELOCITY, VORTICITY, MACH, TEMPERATURE, ENTROPY )

